; PlatformIO project (CLion / VS Code).
; Usage:  pio run  (build)  |  pio run -t upload  (flash)  |  pio device monitor  (serial)

[platformio]
src_dir = .            ; flat layout, no src/ subdir

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; 600 MHz core -> F_BUS_ACTUAL = 150 MHz (GPT clock source; tick rate set by TB_PERCLK_DIV in config.h)
board_build.f_cpu = 600000000L

build_flags =
    -O2
    -Wall
    -D USB_SERIAL      ; USB CDC = Serial; the log goes out over Serial

monitor_speed = 115200
; upload_port = /dev/ttyACM0   ; usually auto-detected (the port renames after flashing)
